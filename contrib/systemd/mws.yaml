# Example mws configuration for use with the systemd unit
# in this directory (mws.service).
# Install as /etc/mws/config.yaml

# listen on http and https
http: :80
https: :443

# Certificates for https.
# If this file is not present, mws will generate a temporary,
# self-signed certificate for the local hostname and localhost instead.
tlskey: /etc/mws/certs/privkey.pem
tlscert: /etc/mws/certs/fullchain.pem

# Example reverse proxy entry, forwards /admin/ to an internal service.
# Remove or adjust this section if no reverse proxy is needed.
revproxy:
  - urlpath: /admin/
    target: http://internal.example.com:8080
